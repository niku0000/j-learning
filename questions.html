<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問題筆記 · N4</title>
<style>
  :root {
    --bg:#f5f3ef; --card:#fff; --text:#2b2b2b; --muted:#7a7671;
    --accent:#3f7dd4; --accent-soft:#e4edfb; --border:#e5e0d8;
    --reading:#9a938a; --tag-bg:#efece6; --rule-bg:#eef3fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1b1a18; --card:#262421; --text:#e8e4dd; --muted:#9a938a;
      --accent:#5c9be8; --accent-soft:#26303a; --border:#38352f;
      --reading:#8a837a; --tag-bg:#322f2a; --rule-bg:#21292f;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,"Hiragino Sans","Noto Sans TC","PingFang TC",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.75;
    padding:0 16px 60px; -webkit-font-smoothing:antialiased;
  }
  header { max-width:760px; margin:0 auto; padding:24px 4px 8px; }
  h1 { font-size:1.4rem; } h1 .jp { color:var(--accent); }
  .nav { font-size:0.85rem; margin-top:4px; }
  .nav a { color:var(--muted); text-decoration:none; margin-right:14px; }
  .nav a.here { color:var(--accent); font-weight:600; }
  .controls { position:sticky; top:0; z-index:10; background:var(--bg); max-width:760px; margin:0 auto; padding:12px 0; }
  #search { width:100%; padding:12px 16px; font-size:1rem; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); outline:none; }
  #search:focus { border-color:var(--accent); }
  .tags-bar { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .tag-filter { font-size:0.78rem; padding:4px 11px; border-radius:999px; background:var(--tag-bg); color:var(--muted); border:1px solid transparent; cursor:pointer; user-select:none; }
  .tag-filter.active { background:var(--accent); color:#fff; }
  .stats { color:var(--muted); font-size:0.8rem; margin:6px 2px 0; }
  main { max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-top:16px; }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
  .meta { font-size:0.75rem; color:var(--muted); }
  .topic { display:inline-block; font-size:0.72rem; padding:2px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .context { font-size:1.15rem; font-weight:600; }
  .q { margin-top:8px; font-weight:600; }
  .q::before { content:"Q　"; color:var(--accent); font-weight:700; }
  .a { margin-top:8px; }
  .a::before { content:"A　"; color:var(--muted); font-weight:700; }
  .section-label { font-size:0.72rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin:16px 0 6px; }
  .rules { background:var(--rule-bg); border-radius:12px; padding:10px 14px 10px 30px; }
  .rules li { margin:5px 0; font-size:0.92rem; }
  .summary { margin-top:12px; padding:10px 14px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0; font-weight:600; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:14px; }
  .card-tag { font-size:0.72rem; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
  footer { max-width:760px; margin:40px auto 0; color:var(--muted); font-size:0.75rem; text-align:center; }

  /* 摸魚模式（樸素黑白，與其他頁共用） */
  body.work { background:#fff; color:#1f1f1f; font-family:"Segoe UI",Arial,"Noto Sans TC",sans-serif; font-size:13px; }
  body.work h1, body.work h1 .jp { color:#202020; font-size:1rem; }
  body.work .nav a.here { color:#202020; }
  body.work .controls { background:#fff; }
  body.work #search { border-radius:3px; border:1px solid #c8c8c8; }
  body.work .card { border:none; border-bottom:1px solid #e2e2e2; border-radius:0; padding:12px 0; }
  body.work .topic, body.work .card-tag { background:#f0f0f0; color:#555; border-radius:2px; }
  body.work .tag-filter.active { background:#555; color:#fff; }
  body.work .q::before { color:#333; }
  body.work .rules, body.work .summary { background:#f6f6f6; }
  body.work .summary { border-left-color:#999; }
  body.work footer { display:none; }
  .work-toggle { position:fixed; right:14px; bottom:14px; z-index:50; font-size:0.72rem; padding:6px 12px; border-radius:999px; background:var(--card); color:var(--muted); border:1px solid var(--border); cursor:pointer; opacity:0.5; }
  .work-toggle:hover { opacity:1; }
  body.work .work-toggle { background:#fff; color:#999; border:1px solid #d0d0d0; opacity:0.4; }
</style>
</head>
<body>
<header>
  <h1><span class="jp">問題筆記</span> <span style="font-size:0.7rem;color:var(--muted);">N4</span></h1>
  <div class="nav"><a href="index.html">學習記錄</a><a href="drill.html">動詞道場</a><a href="questions.html" class="here">問題筆記</a></div>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="🔍 搜尋問題 / 主題 / 例句…">
  <div class="tags-bar" id="tagsBar"></div>
  <div class="stats" id="stats"></div>
</div>

<main id="list"></main>
<footer>我特別提出來的問題 ・ 每次發問就會自動記錄</footer>

<button class="work-toggle" id="workToggle" title="切換摸魚模式（Esc）">摸魚模式</button>

<script>
let ITEMS = [];
let activeTag = null, query = "";

async function load() {
  try {
    const res = await fetch("questions.json?_=" + Date.now());
    const data = await res.json();
    ITEMS = (data.questions || []).slice().reverse();
  } catch (e) {
    document.getElementById("list").innerHTML = '<div class="empty">無法載入 questions.json<br>' + e + '</div>';
    return;
  }
  renderTags(); render();
}
function allTags() {
  const s = new Set();
  ITEMS.forEach(e => (e.tags || []).forEach(t => s.add(t)));
  return [...s].sort();
}
function renderTags() {
  const bar = document.getElementById("tagsBar");
  bar.innerHTML = "";
  allTags().forEach(t => {
    const el = document.createElement("span");
    el.className = "tag-filter" + (activeTag === t ? " active" : "");
    el.textContent = "#" + t;
    el.onclick = () => { activeTag = (activeTag === t ? null : t); renderTags(); render(); };
    bar.appendChild(el);
  });
}
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function matches(e) {
  if (activeTag && !(e.tags||[]).includes(activeTag)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [e.topic,e.context,e.question,e.answer,e.summary,...(e.tags||[]),...(e.rules||[])].join(" ").toLowerCase();
  return hay.includes(q);
}
function render() {
  const list = document.getElementById("list");
  const f = ITEMS.filter(matches);
  document.getElementById("stats").textContent = `共 ${ITEMS.length} 則問題` + (f.length!==ITEMS.length?`，符合 ${f.length} 則`:"");
  if (!f.length) { list.innerHTML = '<div class="empty">找不到符合的問題</div>'; return; }
  list.innerHTML = f.map(cardHTML).join("");
  list.querySelectorAll(".card-tag").forEach(el => el.onclick = () => { activeTag = el.dataset.tag; renderTags(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
}
function cardHTML(e) {
  const rules = (e.rules||[]).map(r => `<li>${esc(r)}</li>`).join("");
  const tags = (e.tags||[]).map(t => `<span class="card-tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("");
  return `
  <div class="card">
    <div class="card-top"><span class="topic">${esc(e.topic||"問題")}</span><span class="meta">${esc(e.date||"")}</span></div>
    ${e.context ? `<div class="context">${esc(e.context)}</div>` : ""}
    <div class="q">${esc(e.question)}</div>
    ${e.answer ? `<div class="a">${esc(e.answer)}</div>` : ""}
    ${rules ? `<div class="section-label">排列/規律重點</div><ul class="rules">${rules}</ul>` : ""}
    ${e.summary ? `<div class="summary">${esc(e.summary)}</div>` : ""}
    ${tags ? `<div class="card-tags">${tags}</div>` : ""}
  </div>`;
}
document.getElementById("search").addEventListener("input", ev => { query = ev.target.value.trim(); render(); });

// 摸魚模式
const workBtn = document.getElementById("workToggle");
function applyWork(on){ document.body.classList.toggle("work",on); document.title = on?"工作紀錄_2026Q3.xlsx - Excel":"問題筆記 · N4"; workBtn.textContent = on?"一般模式":"摸魚模式"; localStorage.setItem("workMode",on?"1":"0"); }
workBtn.onclick = () => applyWork(!document.body.classList.contains("work"));
document.addEventListener("keydown", e => { if (e.key==="Escape") applyWork(!document.body.classList.contains("work")); });
applyWork(localStorage.getItem("workMode")==="1");

load();
</script>
</body>
</html>
