<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文學習記錄 · N4</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7671;
    --accent: #d4573f;
    --accent-soft: #fbe9e4;
    --border: #e5e0d8;
    --tag-bg: #efece6;
    --reading: #9a938a;
    --grammar-bg: #eef4f0;
    --grammar-accent: #4a8c6f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --card: #262421;
      --text: #e8e4dd;
      --muted: #9a938a;
      --accent: #e8735c;
      --accent-soft: #3a2a26;
      --border: #38352f;
      --tag-bg: #322f2a;
      --reading: #8a837a;
      --grammar-bg: #21302a;
      --grammar-accent: #6bbd97;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 0 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 4px 16px;
  }
  h1 { font-size: 1.5rem; letter-spacing: 0.5px; }
  h1 .jp { color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    max-width: 760px; margin: 0 auto;
    padding: 12px 0;
  }
  #search {
    width: 100%; padding: 12px 16px;
    font-size: 1rem; border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .tags-bar {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .tag-filter {
    font-size: 0.78rem; padding: 4px 11px; border-radius: 999px;
    background: var(--tag-bg); color: var(--muted);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .tag-filter.active { background: var(--accent); color: #fff; }
  .stats { color: var(--muted); font-size: 0.8rem; margin: 6px 2px 0; }
  main { max-width: 760px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-top: 16px;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; margin-bottom: 12px;
  }
  .meta { font-size: 0.75rem; color: var(--muted); }
  .meta .src { color: var(--accent); font-weight: 600; }
  .original {
    font-size: 1.3rem; font-weight: 600; line-height: 1.55;
  }
  ruby rt { color: var(--reading); font-size: 0.55em; }
  .reading { color: var(--reading); font-size: 0.85rem; margin-top: 2px; }
  .translation {
    margin-top: 10px; padding-left: 12px;
    border-left: 3px solid var(--accent); color: var(--text);
  }
  .section-label {
    font-size: 0.72rem; color: var(--muted); letter-spacing: 1px;
    text-transform: uppercase; margin: 16px 0 6px;
  }
  .word-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline;
    padding: 5px 0; border-bottom: 1px dashed var(--border);
  }
  .word-row:last-child { border-bottom: none; }
  .w-jp { font-weight: 600; }
  .w-reading { color: var(--reading); font-size: 0.82rem; }
  .w-pos {
    font-size: 0.68rem; background: var(--tag-bg); color: var(--muted);
    padding: 1px 7px; border-radius: 6px;
  }
  .w-mean { color: var(--text); font-size: 0.92rem; }
  .grammar {
    background: var(--grammar-bg); border-radius: 12px;
    padding: 12px 14px; margin-top: 8px;
  }
  .g-point {
    font-weight: 700; color: var(--grammar-accent);
    font-size: 0.98rem; margin-bottom: 4px;
  }
  .g-explain { font-size: 0.92rem; }
  .note {
    margin-top: 12px; font-size: 0.85rem; color: var(--muted);
    font-style: italic;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; }
  .card-tag {
    font-size: 0.72rem; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  footer { max-width: 760px; margin: 40px auto 0; color: var(--muted); font-size: 0.75rem; text-align: center; }

  /* 切換鈕 */
  .work-toggle {
    position: fixed; right: 14px; bottom: 14px; z-index: 50;
    font-size: 0.72rem; padding: 6px 12px; border-radius: 999px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border); cursor: pointer; opacity: 0.55;
  }
  .work-toggle:hover { opacity: 1; }

  /* 偽 Excel 外框（預設隱藏） */
  .xl-chrome { display: none; }

  /* ===== 摸魚模式（WORK）：偽 Excel 試算表 ===== */
  body.work {
    background: #ffffff; color: #217346;
    font-family: "Segoe UI", "Calibri", -apple-system, "Noto Sans TC", Arial, sans-serif;
    font-size: 12px; line-height: 1.45; padding: 0;
    color: #1f1f1f;
  }
  body.work header .sub, body.work footer { display: none; }
  body.work h1 { display: none; }

  /* Excel 頂部外框 */
  body.work .xl-chrome { display: block; position: sticky; top: 0; z-index: 20; }
  .xl-titlebar {
    display: flex; align-items: center; gap: 10px;
    background: #217346; color: #fff; padding: 5px 12px; font-size: 12px;
  }
  .xl-logo {
    background: #fff; color: #217346; font-weight: 800;
    width: 18px; height: 18px; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .xl-filename { font-weight: 600; }
  .xl-menu { color: #cfe6d9; font-size: 11px; margin-left: 6px; }
  .xl-colrow {
    display: flex; background: #f3f3f3; border-bottom: 1px solid #d0d0d0;
    color: #666; font-size: 11px;
  }
  .xl-colrow .xl-cell {
    flex: 1; text-align: center; padding: 2px 0;
    border-right: 1px solid #e0e0e0;
  }
  .xl-colrow .xl-corner {
    flex: 0 0 34px; background: #e9e9e9; border-right: 1px solid #d0d0d0;
  }

  body.work header { padding: 0; border: none; }
  body.work .controls {
    background: #fff; padding: 4px 8px; max-width: none;
    border-bottom: 1px solid #d0d0d0;
    display: flex; align-items: center; gap: 8px;
  }
  body.work #search {
    border-radius: 2px; border: 1px solid #c8c8c8; background: #fff;
    color: #202020; font-size: 12px; padding: 3px 8px; max-width: 260px;
  }
  body.work #search:focus { border-color: #217346; }
  body.work .tags-bar { gap: 3px; margin: 0; flex: 1; }
  body.work .tag-filter {
    border-radius: 2px; background: #f0f0f0; color: #555;
    border: 1px solid #dcdcdc; font-size: 11px; padding: 2px 8px;
  }
  body.work .tag-filter.active { background: #217346; color: #fff; border-color: #217346; }
  body.work .stats { color: #808080; margin: 0; white-space: nowrap; }

  body.work main { max-width: none; margin: 0; }
  /* 每筆記錄 = 一列儲存格 */
  body.work .card {
    background: #fff; border: none; border-bottom: 1px solid #dcdcdc;
    border-radius: 0; padding: 8px 12px; margin: 0;
  }
  body.work main .card:nth-child(even) { background: #f7faf8; }
  body.work .card-top { margin-bottom: 4px; }
  body.work .meta, body.work .meta .src { color: #909090; font-weight: 400; }
  body.work .original { font-size: 13px; font-weight: 600; color: #202020; }
  body.work .reading, body.work .w-reading, body.work ruby rt { color: #999; }
  body.work .translation { border-left: 2px solid #c8c8c8; color: #404040; padding-left: 8px; margin-top: 4px; }
  body.work .section-label { color: #a0a0a0; margin: 8px 0 3px; letter-spacing: 0.5px; }
  body.work .word-row { padding: 3px 0; }
  body.work .w-pos { background: #eef3ef; color: #777; border-radius: 2px; }
  body.work .grammar { background: #f4f7f5; border-radius: 2px; padding: 6px 9px; }
  body.work .g-point { color: #217346; font-weight: 600; }
  body.work .g-explain { color: #404040; }
  body.work .card-tags { margin-top: 8px; }
  body.work .card-tag { background: #eef3ef; color: #557; border-radius: 2px; }
  body.work .note { color: #999; }
  body.work .work-toggle {
    background: #fff; color: #999; border: 1px solid #d0d0d0; opacity: 0.35;
  }
</style>
</head>
<body>
<!-- 摸魚模式：偽 Excel 外框（一般模式隱藏） -->
<div class="xl-chrome" id="xlChrome">
  <div class="xl-titlebar">
    <span class="xl-logo">X</span>
    <span class="xl-filename" id="xlFilename">工作紀錄_2026Q3.xlsx</span>
    <span class="xl-menu">檔案　常用　插入　頁面配置　公式　資料　校閱　檢視</span>
  </div>
  <div class="xl-colrow" id="xlCols"></div>
</div>

<header>
  <h1><span class="jp">日本語</span> 學習記錄 <span style="font-size:0.7rem;color:var(--muted);">N4</span></h1>
  <div class="sub">透過小說・遊戲累積的句子・單字・文法　·　<a href="drill.html" style="color:var(--accent);text-decoration:none;">動詞道場 →</a></div>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="🔍 搜尋原文 / 中文 / 單字 / 文法…">
  <div class="tags-bar" id="tagsBar"></div>
  <div class="stats" id="stats"></div>
</div>

<main id="list"></main>
<footer>資料來源：data.json ・ 每次學到新句子就會自動更新</footer>

<button class="work-toggle" id="workToggle" title="切換摸魚模式（快捷鍵：Esc）">摸魚模式</button>

<script>
let ENTRIES = [];
let activeTag = null;
let query = "";

async function load() {
  try {
    const res = await fetch("data.json?_=" + Date.now());
    const data = await res.json();
    ENTRIES = (data.entries || []).slice().reverse(); // 最新在上
  } catch (e) {
    document.getElementById("list").innerHTML =
      '<div class="empty">無法載入 data.json<br>' + e + '</div>';
    return;
  }
  renderTags();
  render();
}

function allTags() {
  const s = new Set();
  ENTRIES.forEach(e => (e.tags || []).forEach(t => s.add(t)));
  return [...s].sort();
}

function renderTags() {
  const bar = document.getElementById("tagsBar");
  const tags = allTags();
  bar.innerHTML = "";
  tags.forEach(t => {
    const el = document.createElement("span");
    el.className = "tag-filter" + (activeTag === t ? " active" : "");
    el.textContent = "#" + t;
    el.onclick = () => { activeTag = (activeTag === t ? null : t); renderTags(); render(); };
    bar.appendChild(el);
  });
}

function matches(e) {
  if (activeTag && !(e.tags || []).includes(activeTag)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [
    e.original, e.reading, e.translation, e.source, e.note,
    ...(e.tags || []),
    ...(e.words || []).flatMap(w => [w.word, w.reading, w.meaning]),
    ...(e.grammar || []).flatMap(g => [g.point, g.explain])
  ].join(" ").toLowerCase();
  return hay.includes(q);
}

function esc(s) {
  return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function render() {
  const list = document.getElementById("list");
  const filtered = ENTRIES.filter(matches);
  document.getElementById("stats").textContent =
    `共 ${ENTRIES.length} 筆記錄` + (filtered.length !== ENTRIES.length ? `，符合 ${filtered.length} 筆` : "");
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">找不到符合的記錄</div>';
    return;
  }
  list.innerHTML = filtered.map(cardHTML).join("");
  list.querySelectorAll(".card-tag").forEach(el => {
    el.onclick = () => { activeTag = el.dataset.tag; renderTags(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}

function cardHTML(e) {
  const words = (e.words || []).map(w => `
    <div class="word-row">
      <span class="w-jp">${esc(w.word)}</span>
      ${w.reading && w.reading !== w.word ? `<span class="w-reading">${esc(w.reading)}</span>` : ""}
      ${w.pos ? `<span class="w-pos">${esc(w.pos)}</span>` : ""}
      <span class="w-mean">${esc(w.meaning)}</span>
    </div>`).join("");
  const grammar = (e.grammar || []).map(g => `
    <div class="grammar">
      <div class="g-point">${esc(g.point)}</div>
      <div class="g-explain">${esc(g.explain)}</div>
    </div>`).join("");
  const tags = (e.tags || []).map(t =>
    `<span class="card-tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("");
  return `
  <div class="card">
    <div class="card-top">
      <div class="meta"><span class="src">${esc(e.source || "—")}</span> · ${esc(e.date || "")}</div>
      <div class="meta">${e.type === "word" ? "單字" : "句子"}</div>
    </div>
    <div class="original">${esc(e.original)}</div>
    ${e.reading ? `<div class="reading">${esc(e.reading)}</div>` : ""}
    ${e.translation ? `<div class="translation">${esc(e.translation)}</div>` : ""}
    ${words ? `<div class="section-label">單字拆解</div>${words}` : ""}
    ${grammar ? `<div class="section-label">文法・句型</div>${grammar}` : ""}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    ${tags ? `<div class="card-tags">${tags}</div>` : ""}
  </div>`;
}

document.getElementById("search").addEventListener("input", ev => {
  query = ev.target.value.trim();
  render();
});

// ===== 摸魚模式（偽 Excel） =====
const workBtn = document.getElementById("workToggle");
const WORK_TITLE = "工作紀錄_2026Q3.xlsx - Excel";
// 建立欄位字母列 A B C ...
(function buildCols() {
  const wrap = document.getElementById("xlCols");
  let html = '<div class="xl-cell xl-corner"></div>';
  for (const c of "ABCDEFGHIJKLMN") html += '<div class="xl-cell">' + c + '</div>';
  wrap.innerHTML = html;
})();
function applyWork(on) {
  document.body.classList.toggle("work", on);
  document.title = on ? WORK_TITLE : "日文學習記錄 · N4";
  workBtn.textContent = on ? "一般模式" : "摸魚模式";
  localStorage.setItem("workMode", on ? "1" : "0");
}
workBtn.onclick = () => applyWork(!document.body.classList.contains("work"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") applyWork(!document.body.classList.contains("work"));
});
applyWork(localStorage.getItem("workMode") === "1");

load();
</script>
</body>
</html>
